<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="blue" data-gradient="soft">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WZ-Assistant</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ============================================
           ТЕМЫ
           ============================================ */
        :root[data-theme="light"] {
            --bg-primary: #f4f6f9;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef1f6;
            --bg-elevated: #ffffff;
            --text-primary: #1a2433;
            --text-secondary: #6b7a8f;
            --text-muted: #9aa8ba;
            --border: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
        }

        :root[data-theme="dark"] {
            --bg-primary: #0f1620;
            --bg-secondary: #1a2433;
            --bg-tertiary: #253243;
            --bg-elevated: #2d3b4d;
            --text-primary: #e8eef5;
            --text-secondary: #7a8a9e;
            --text-muted: #4d5c6e;
            --border: rgba(255, 255, 255, 0.06);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        :root[data-theme="oled"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #141414;
            --bg-elevated: #1a1a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #8a8a8a;
            --text-muted: #555555;
            --border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.85);
        }

        /* ============================================
           ЦВЕТА АКЦЕНТА
           ============================================ */
        :root[data-accent="blue"]   { --accent: #5a9fd4; --accent-hover: #7ab5e0; --accent-soft: rgba(90, 159, 212, 0.15); --accent-dark: #2b5278; }
        :root[data-accent="purple"] { --accent: #9d7bd8; --accent-hover: #b398e5; --accent-soft: rgba(157, 123, 216, 0.15); --accent-dark: #4a3670; }
        :root[data-accent="green"]  { --accent: #4dd07a; --accent-hover: #6ee093; --accent-soft: rgba(77, 208, 122, 0.15); --accent-dark: #2a6640; }
        :root[data-accent="orange"] { --accent: #f0a848; --accent-hover: #f4bc6b; --accent-soft: rgba(240, 168, 72, 0.15); --accent-dark: #7a5420; }
        :root[data-accent="red"]    { --accent: #f05252; --accent-hover: #f47474; --accent-soft: rgba(240, 82, 82, 0.15); --accent-dark: #7a2020; }
        :root[data-accent="pink"]   { --accent: #e87db8; --accent-hover: #ee9ccb; --accent-soft: rgba(232, 125, 184, 0.15); --accent-dark: #6e3656; }

        /* ============================================
           ГРАДИЕНТЫ
           ============================================ */
        :root[data-gradient="flat"] {
            --gradient: linear-gradient(160deg, var(--accent) 0%, var(--accent) 100%);
        }
        :root[data-gradient="soft"] {
            --gradient: linear-gradient(160deg, var(--accent) 0%, var(--accent-dark) 100%);
        }
        :root[data-gradient="vivid"] {
            --gradient: linear-gradient(160deg, var(--accent-hover) 0%, var(--accent) 50%, var(--accent-dark) 100%);
        }
        :root[data-gradient="diagonal"] {
            --gradient: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 40%, var(--accent-hover) 100%);
        }

        /* ============================================
           БАЗА
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 88px;
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }

        /* ============================================
           ХЕДЕР
           ============================================ */
        .header {
            background: var(--gradient);
            padding: 32px 20px 36px;
            border-radius: 0 0 32px 32px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            text-align: center;
            transition: background 0.3s ease;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -25%;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -60%;
            left: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header .bot-username {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* ============================================
           КОНТЕНТ
           ============================================ */
        .content {
            padding: 0 16px;
            animation: fadeSlide 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           СКЕЛЕТОН
           ============================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-secondary) 0%, var(--bg-tertiary) 50%, var(--bg-secondary) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 20px;
            height: 76px;
            margin-bottom: 14px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================
           КАРТОЧКИ
           ============================================ */
        .card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:active {
            transform: scale(0.985);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.2px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ============================================
           КНОПКИ
           ============================================ */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 18px;
            margin-bottom: 12px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            box-shadow: var(--shadow-sm);
            letter-spacing: -0.1px;
        }

        .btn:active {
            transform: scale(0.97);
            background: var(--bg-tertiary);
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-primary:active {
            background: var(--accent-hover);
        }

        .btn-success {
            background: var(--success, #4dd07a);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-danger {
            background: var(--danger, #f05252);
            color: #ffffff;
            border-color: transparent;
        }

        /* ============================================
           ФОРМЫ
           ============================================ */
        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: -0.1px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1.5px solid transparent;
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.1px;
        }

        .input:focus {
            border-color: var(--accent);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        textarea.input {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }

        select.input {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%237a8a9e' d='M6 8L0 0h12z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        /* ============================================
           НИЖНЕЕ МЕНЮ
           ============================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 8px 12px;
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(20px);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            border-radius: 14px;
            letter-spacing: -0.1px;
        }

        .nav-item.active {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .nav-item .icon {
            font-size: 22px;
            line-height: 1;
        }

        /* ============================================
           ПУСТЫЕ СОСТОЯНИЯ
           ============================================ */
        .empty {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .empty .icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.4;
            display: block;
        }

        .empty p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* ============================================
           СПИСКИ
           ============================================ */
        .list-item {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .list-item-info {
            flex: 1;
            min-width: 0;
        }

        .list-item-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            word-break: break-word;
            letter-spacing: -0.2px;
        }

        .list-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .badge-lecture { background: rgba(90, 159, 212, 0.2); color: #5a9fd4; }
        .badge-practice { background: rgba(77, 208, 122, 0.2); color: #4dd07a; }
        .badge-seminar { background: rgba(240, 168, 72, 0.2); color: #f0a848; }

        .btn-delete {
            background: transparent;
            color: var(--danger, #f05252);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            margin-left: 12px;
            transition: all 0.18s ease;
        }

        .btn-delete:active {
            background: var(--danger, #f05252);
            color: white;
        }

        /* ============================================
           МОДАЛКА
           ============================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            display: none;
            align-items: flex-end;
            z-index: 200;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            width: 100%;
            border-radius: 28px 28px 0 0;
            padding: 20px 20px 32px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 1px solid var(--border);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 2px;
            margin: 0 auto 20px;
            opacity: 0.4;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .modal-close:active {
            background: var(--bg-elevated);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .modal-actions .btn {
            margin-bottom: 0;
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 300;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================
           ДОСТУП ЗАПРЕЩЁН
           ============================================ */
        .access-denied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 40px 24px;
            text-align: center;
        }

        .access-denied .icon {
            font-size: 72px;
            margin-bottom: 24px;
        }

        .access-denied h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .access-denied p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 320px;
            margin-bottom: 20px;
        }

        .debug-info {
            background: var(--bg-tertiary);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            margin-top: 16px;
            word-break: break-all;
            max-width: 320px;
        }

        /* ============================================
           НАСТРОЙКИ
           ============================================ */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .setting-row:active {
            opacity: 0.7;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        .setting-value {
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
        }

        /* ============================================
           СЕТКА ЦВЕТОВ / ТЕМ
           ============================================ */
        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 8px;
            background: var(--bg-tertiary);
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .option-item:active {
            transform: scale(0.95);
        }

        .option-item.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .option-item .color-preview {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        .option-item .option-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .option-item.selected .option-label {
            color: var(--accent);
        }

        .option-item .theme-icon {
            font-size: 24px;
            line-height: 1;
        }

        /* ============================================
           ГРАДИЕНТ ПРЕВЬЮ
           ============================================ */
        .gradient-preview {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        /* ============================================
           ДЕНЬ НЕДЕЛИ
           ============================================ */
        .day-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            margin: 20px 4px 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .day-header:first-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-content">
                <h1>WZ-Assistant</h1>
                <div class="bot-username">@wz_assistant_bot</div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content" id="content">
            <!-- Skeleton во время загрузки -->
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav" id="bottom-nav" style="display:none;">
            <button class="nav-item active" data-page="schedule">
                <span class="icon">📅</span>
                <span>Расписание</span>
            </button>
            <button class="nav-item" data-page="tasks">
                <span class="icon">📝</span>
                <span>Задания</span>
            </button>
            <button class="nav-item" data-page="shared">
                <span class="icon">🌐</span>
                <span>Общее</span>
            </button>
            <button class="nav-item" data-page="settings">
                <span class="icon">⚙️</span>
                <span>Настройки</span>
            </button>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Заголовок</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">Сохранено</div>

    <script>
        // ============================================
        // 1. TELEGRAM INIT
        // ============================================
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ============================================
        // 2. НАСТРОЙКИ ОФОРМЛЕНИЯ
        // ============================================
        const THEMES = {
            light: { name: 'Светлая', icon: '☀️' },
            dark:  { name: 'Тёмная',  icon: '🌙' },
            oled:  { name: 'OLED',    icon: '⚫' }
        };

        const ACCENTS = {
            blue:   { name: 'Синий',      color: '#5a9fd4' },
            purple: { name: 'Фиолетовый', color: '#9d7bd8' },
            green:  { name: 'Зелёный',    color: '#4dd07a' },
            orange: { name: 'Оранжевый',  color: '#f0a848' },
            red:    { name: 'Красный',    color: '#f05252' },
            pink:   { name: 'Розовый',    color: '#e87db8' }
        };

        const GRADIENTS = {
            flat:     { name: 'Плоский' },
            soft:     { name: 'Мягкий' },
            vivid:    { name: 'Яркий' },
            diagonal: { name: 'Диагональный' }
        };

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('wz_theme', theme);
            updateTelegramColors();
        }

        function applyAccent(accent) {
            document.documentElement.setAttribute('data-accent', accent);
            localStorage.setItem('wz_accent', accent);
            updateTelegramColors();
        }

        function applyGradient(gradient) {
            document.documentElement.setAttribute('data-gradient', gradient);
            localStorage.setItem('wz_gradient', gradient);
        }

        function updateTelegramColors() {
            const theme = document.documentElement.getAttribute('data-theme');
            const colors = {
                light: '#f4f6f9',
                dark:  '#0f1620',
                oled:  '#000000'
            };
            try {
                tg.setHeaderColor(colors[theme] || colors.dark);
                tg.setBackgroundColor(colors[theme] || colors.dark);
            } catch (e) {}
        }

        function initAppearance() {
            const theme = localStorage.getItem('wz_theme') || 'dark';
            const accent = localStorage.getItem('wz_accent') || 'blue';
            const gradient = localStorage.getItem('wz_gradient') || 'soft';
            applyTheme(theme);
            applyAccent(accent);
            applyGradient(gradient);
        }

        // ============================================
        // 3. ЗАГРУЗКА ДАННЫХ С КЕШЕМ
        // ============================================
        const DATA_BASE = './data';
        const CACHE_KEY = 'wz_cache_v1';

        async function loadJSON(name) {
            try {
                const res = await fetch(`${DATA_BASE}/${name}.json?v=${Date.now()}`);
                if (!res.ok) throw new Error('Not found');
                return await res.json();
            } catch (e) {
                console.warn(`Не удалось загрузить ${name}:`, e);
                return null;
            }
        }

        function saveCache(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        // ============================================
        // 4. STATE
        // ============================================
        const state = {
            page: 'schedule',
            user: null,
            userName: 'Гость',
            role: 'guest',
            participants: {},
            schedule: [],
            tasks: [],
            files: [],
            notes: [],
            substitutions: [],
            loaded: false,
            debugId: null
        };

        // ============================================
        // 5. ИНИЦИАЛИЗАЦИЯ
        // ============================================
        async function init() {
            initAppearance();

            // Получаем юзера
            state.user = tg.initDataUnsafe?.user || null;
            state.debugId = state.user ? String(state.user.id) : 'нет Telegram ID (открыто в браузере)';

            // 1. Показываем кеш, если есть
            const cache = loadCache();
            if (cache) {
                Object.assign(state, cache);
                state.loaded = true;
                // Определяем роль из кеша
                if (state.user) {
                    const uid = String(state.user.id);
                    const p = state.participants[uid];
                    state.role = p ? p.role : 'guest';
                    state.userName = p ? p.name : (state.user.first_name || 'Гость');
                }
            }

            // 2. Загружаем свежие данные
            const [participants, schedule, files, notes, substitutions] = await Promise.all([
                loadJSON('participants'),
                loadJSON('schedule'),
                loadJSON('files'),
                loadJSON('notes'),
                loadJSON('substitutions')
            ]);

            state.participants = participants || state.participants;
            state.schedule = schedule?.lessons || state.schedule;
            state.files = files?.categories || state.files;
            state.notes = notes?.notes || state.notes;
            state.substitutions = substitutions?.substitutions || state.substitutions;

            // Определяем роль заново
            if (state.user) {
                const uid = String(state.user.id);
                const p = state.participants[uid];
                state.role = p ? p.role : 'guest';
                state.userName = p ? p.name : (state.user.first_name || 'Гость');
            } else {
                state.role = 'guest';
                state.userName = 'Тест (без Telegram)';
            }

            // Кешируем
            saveCache({
                participants: state.participants,
                schedule: state.schedule,
                files: state.files,
                notes: state.notes,
                substitutions: state.substitutions
            });

            state.loaded = true;

            // 3. Рендерим
            if (state.role === 'guest') {
                renderAccessDenied();
                return;
            }

            document.getElementById('bottom-nav').style.display = 'flex';
            setupNav();
            renderPage();
        }

        // ============================================
        // 6. ДОСТУП ЗАПРЕЩЁН
        // ============================================
        function renderAccessDenied() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="access-denied">
                    <div class="icon">🚫</div>
                    <h2>Доступ запрещён</h2>
                    <p>Вы не являетесь участником приложения. Обратитесь к <b>Мистеру WaWeeZ</b> для получения доступа.</p>
                    <div class="debug-info">
                        <b>Ваш TG ID:</b><br>
                        ${state.debugId}
                    </div>
                </div>
            `;
        }

        // ============================================
        // 7. РОУТЕР
        // ============================================
        function setupNav() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.page = btn.dataset.page;
                    renderPage();
                });
            });
        }

        function renderPage() {
            if (state.page === 'schedule') renderSchedule();
            else if (state.page === 'tasks') renderTasks();
            else if (state.page === 'shared') renderShared();
            else if (state.page === 'settings') renderSettings();
        }

        // ============================================
        // 8. РАСПИСАНИЕ
        // ============================================
        function renderSchedule() {
            const content = document.getElementById('content');
            let html = '';

            if (state.schedule.length === 0) {
                html = `
                    <div class="empty">
                        <span class="icon">📅</span>
                        <p>Расписание пустое<br>Добавьте первое занятие</p>
                    </div>
                `;
            } else {
                const days = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
                const grouped = {};
                state.schedule.forEach(item => {
                    const day = item.day || 'Понедельник';
                    if (!grouped[day]) grouped[day] = [];
                    grouped[day].push(item);
                });

                days.forEach(day => {
                    if (grouped[day]) {
                        html += `<div class="day-header">${day}</div>`;
                        grouped[day].forEach(item => {
                            const badgeClass = item.type === 'lecture' ? 'badge-lecture'
                                            : item.type === 'practice' ? 'badge-practice'
                                            : 'badge-seminar';
                            const typeText = item.type === 'lecture' ? 'Лекция'
                                            : item.type === 'practice' ? 'Практика'
                                            : 'Семинар';
                            html += `
                                <div class="list-item">
                                    <div class="list-item-info">
                                        <div class="list-item-title">${escapeHtml(item.name)}</div>
                                        <div class="list-item-meta">
                                            <span class="badge ${badgeClass}">${typeText}</span>
                                            <span>⏱ ${item.duration} мин</span>
                                            <span>📍 ${escapeHtml(item.place)}</span>
                                        </div>
                                    </div>
                                    ${canEdit() ? `<button class="btn-delete" onclick="deleteScheduleItem('${item.id}')">🗑</button>` : ''}
                                </div>
                            `;
                        });
                    }
                });
            }

            if (canEdit()) {
                html += `<button class="btn btn-primary" onclick="showAddSchedule()">➕ Добавить занятие</button>`;
            }

            content.innerHTML = html;
        }

        // ============================================
        // 9. ЗАДАНИЯ
        // ============================================
        function renderTasks() {
            const content = document.getElementById('content');
            let html = '';

            if (state.tasks.length === 0) {
                html = `
                    <div class="empty">
                        <span class="icon">📝</span>
                        <p>Заданий пока нет</p>
                    </div>
                `;
            } else {
                state.tasks.forEach(task => {
                    html += `
                        <div class="list-item">
                            <div class="list-item-info">
                                <div class="list-item-title">${escapeHtml(task.subject)}</div>
                                <div class="list-item-meta">${escapeHtml(task.text)}</div>
                            </div>
                        </div>
                    `;
                });
            }

            content.innerHTML = html;
        }

        // ============================================
        // 10. ОБЩЕЕ ПРОСТРАНСТВО
        // ============================================
        function renderShared() {
            const content = document.getElementById('content');
            let html = `
                <div class="card">
                    <div class="card-title">📁 Хранилище файлов</div>
                    <div class="card-subtitle">${state.files.length} категорий</div>
                </div>
                <div class="card">
                    <div class="card-title">📝 Общие заметки</div>
                    <div class="card-subtitle">${state.notes.length} заметок</div>
                </div>
            `;

            if (state.role === 'owner' || state.role === 'starosta') {
                html += `<button class="btn btn-primary" onclick="showSharedSettings()">⚙️ Управление</button>`;
            }

            content.innerHTML = html;
        }

        // ============================================
        // 11. НАСТРОЙКИ
        // ============================================
        function renderSettings() {
            const content = document.getElementById('content');
            const theme = document.documentElement.getAttribute('data-theme');
            const accent = document.documentElement.getAttribute('data-accent');
            const gradient = document.documentElement.getAttribute('data-gradient');

            let html = `
                <div class="card">
                    <div class="card-title">👤 Профиль</div>
                    <div class="card-subtitle">
                        Имя: <b>${escapeHtml(state.userName)}</b><br>
                        Роль: <b>${roleName(state.role)}</b>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">🎨 Оформление</div>
                    <div class="setting-row" onclick="showThemePicker()">
                        <div>
                            <div class="setting-label">Тема</div>
                            <div class="setting-desc">${THEMES[theme].icon} ${THEMES[theme].name}</div>
                        </div>
                        <div class="setting-value">→</div>
                    </div>
                    <div class="setting-row" onclick="showAccentPicker()">
                        <div>
                            <div class="setting-label">Цвет акцента</div>
                            <div class="setting-desc">${ACCENTS[accent].name}</div>
                        </div>
                        <div class="setting-value">→</div>
                    </div>
                    <div class="setting-row" onclick="showGradientPicker()">
                        <div>
                            <div class="setting-label">Градиент</div>
                            <div class="setting-desc">${GRADIENTS[gradient].name}</div>
                        </div>
                        <div class="setting-value">→</div>
                    </div>
                </div>
            `;

            if (state.role === 'owner' || state.role === 'starosta') {
                html += `<button class="btn" onclick="showSubstitutions()">🔄 Замены в расписании</button>`;
            }

            if (state.role === 'owner' || state.role === 'starosta') {
                html += `<button class="btn" onclick="showSharedSettings()">🌐 Общее пространство</button>`;
            }

            content.innerHTML = html;
        }

        // ============================================
        // 12. ПРАВА
        // ============================================
        function canEdit() {
            return state.role === 'owner' || state.role === 'starosta';
        }

        function roleName(role) {
            return { owner: '👑 Владелец', starosta: '🎓 Староста', member: '👤 Ученик', guest: '🚫 Гость' }[role] || role;
        }

        // ============================================
        // 13. ВЫБОР ТЕМЫ / ЦВЕТА / ГРАДИЕНТА
        // ============================================
        function showThemePicker() {
            const current = document.documentElement.getAttribute('data-theme');
            let html = '<div class="grid-options">';
            for (const [key, t] of Object.entries(THEMES)) {
                html += `
                    <div class="option-item ${key === current ? 'selected' : ''}" onclick="pickTheme('${key}')">
                        <div class="theme-icon">${t.icon}</div>
                        <div class="option-label">${t.name}</div>
                    </div>
                `;
            }
            html += '</div>';
            html += `<button class="btn" onclick="closeModal()">Готово</button>`;
            openModal('Тема оформления', html);
        }

        function pickTheme(key) {
            applyTheme(key);
            renderSettings();
            showThemePicker();
            showToast(`Тема: ${THEMES[key].name}`);
        }

        function showAccentPicker() {
            const current = document.documentElement.getAttribute('data-accent');
            let html = '<div class="grid-options">';
            for (const [key, a] of Object.entries(ACCENTS)) {
                html += `
                    <div class="option-item ${key === current ? 'selected' : ''}" onclick="pickAccent('${key}')">
                        <div class="color-preview" style="background:${a.color}"></div>
                        <div class="option-label">${a.name}</div>
                    </div>
                `;
            }
            html += '</div>';
            html += `<button class="btn" onclick="closeModal()">Готово</button>`;
            openModal('Цвет акцента', html);
        }

        function pickAccent(key) {
            applyAccent(key);
            renderSettings();
            showAccentPicker();
            showToast(`Цвет: ${ACCENTS[key].name}`);
        }

        function showGradientPicker() {
            const current = document.documentElement.getAttribute('data-gradient');
            let html = '';
            for (const [key, g] of Object.entries(GRADIENTS)) {
                html += `
                    <div class="option-item ${key === current ? 'selected' : ''}" 
                         style="padding: 12px; margin-bottom: 10px; flex-direction: row; justify-content: space-between;"
                         onclick="pickGradient('${key}')">
                        <div style="flex:1;">
                            <div class="option-label" style="font-size:14px; text-align:left; margin-bottom:6px;">${g.name}</div>
                            <div class="gradient-preview" data-grad="${key}"></div>
                        </div>
                    </div>
                `;
            }
            html += `<button class="btn" onclick="closeModal()">Готово</button>`;
            openModal('Градиент', html);

            // Применяем превью градиентов
            setTimeout(() => {
                document.querySelectorAll('.gradient-preview').forEach(el => {
                    const key = el.dataset.grad;
                    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
                    const accentHover = getComputedStyle(document.documentElement).getPropertyValue('--accent-hover').trim();
                    const accentDark = getComputedStyle(document.documentElement).getPropertyValue('--accent-dark').trim();
                    const grads = {
                        flat: `linear-gradient(160deg, ${accent}, ${accent})`,
                        soft: `linear-gradient(160deg, ${accent}, ${accentDark})`,
                        vivid: `linear-gradient(160deg, ${accentHover}, ${accent}, ${accentDark})`,
                        diagonal: `linear-gradient(135deg, ${accentDark}, ${accent}, ${accentHover})`
                    };
                    el.style.background = grads[key];
                });
            }, 50);
        }

        function pickGradient(key) {
            applyGradient(key);
            showGradientPicker();
            showToast(`Градиент: ${GRADIENTS[key].name}`);
        }

        // ============================================
        // 14. МОДАЛКИ
        // ============================================
        function openModal(title, bodyHtml) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showAddSchedule() {
            const body = `
                <div class="input-group">
                    <label class="input-label">Тип занятия</label>
                    <select class="input" id="inp-type">
                        <option value="lecture">📘 Лекция</option>
                        <option value="practice">✏️ Практика</option>
                        <option value="seminar">💬 Семинар</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Название</label>
                    <input class="input" id="inp-name" placeholder="Математика">
                </div>
                <div class="input-group">
                    <label class="input-label">День недели</label>
                    <select class="input" id="inp-day">
                        <option>Понедельник</option>
                        <option>Вторник</option>
                        <option>Среда</option>
                        <option>Четверг</option>
                        <option>Пятница</option>
                        <option>Суббота</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Продолжительность (мин)</label>
                    <input class="input" id="inp-duration" type="number" value="90">
                </div>
                <div class="input-group">
                    <label class="input-label">Место</label>
                    <input class="input" id="inp-place" placeholder="Ауд. 305">
                </div>
                <div class="modal-actions">
                    <button class="btn" onclick="closeModal()">Отмена</button>
                    <button class="btn btn-success" onclick="addScheduleItem()">Сохранить</button>
                </div>
            `;
            openModal('Добавить занятие', body);
        }

        function addScheduleItem() {
            const name = document.getElementById('inp-name').value.trim();
            const place = document.getElementById('inp-place').value.trim();
            if (!name || !place) return showToast('Заполните все поля');

            const item = {
                id: String(Date.now()),
                type: document.getElementById('inp-type').value,
                name,
                day: document.getElementById('inp-day').value,
                duration: parseInt(document.getElementById('inp-duration').value) || 90,
                place
            };

            state.schedule.push(item);
            sendToBot('add_schedule', item);
            closeModal();
            renderSchedule();
            showToast('Занятие добавлено');
        }

        function deleteScheduleItem(id) {
            state.schedule = state.schedule.filter(i => i.id !== id);
            sendToBot('delete_schedule', { id });
            renderSchedule();
            showToast('Удалено');
        }

        function showSubstitutions() {
            openModal('Замены в расписании', `
                <div class="empty" style="padding: 24px;">
                    <span class="icon">🔄</span>
                    <p>Функционал замен появится позже</p>
                </div>
                <button class="btn" onclick="closeModal()">Понятно</button>
            `);
        }

        function showSharedSettings() {
            openModal('Общее пространство', `
                <div class="card">
                    <div class="card-title">📁 Хранилище файлов</div>
                    <div class="card-subtitle">Управление файлами и категориями</div>
                </div>
                <div class="card">
                    <div class="card-title">📝 Заметки</div>
                    <div class="card-subtitle">Общие заметки участников</div>
                </div>
                <button class="btn" onclick="closeModal()">Закрыть</button>
            `);
        }

        // ============================================
        // 15. ОТПРАВКА БОТУ
        // ============================================
        function sendToBot(action, data = {}) {
            try {
                if (tg.sendData) {
                    tg.sendData(JSON.stringify({ action, ...data }));
                }
            } catch (e) {
                console.warn('sendData error:', e);
            }
        }

        // ============================================
        // 16. УТИЛИТЫ
        // ============================================
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Клик по фону модалки
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // ============================================
        // 17. ЗАПУСК
        // ============================================
        init();
    </script>
</body>
</html>
