<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WZ Assistant</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Приложения</h1>
    <button onclick="alert('Расписания')">📅 Расписания</button>
    <button onclick="alert('Задания')">📝 Задания</button>
    <button onclick="alert('Настройки')">⚙️ Режим настройки</button>

    <script>
        // Инициализация Mini App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Развернуть на весь экран
    </script>
</body>
</html>
